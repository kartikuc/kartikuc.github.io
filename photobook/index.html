<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>snapshots & stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#141311;--bg2:#1c1a17;--paper:#f2ece0;
  --line:#312d27;--line2:#413c34;
  --muted:#8f897c;--ink:#f4f1ea;--ink-dim:#c9c3b6;
  --accent:#d68a3c;--accent-ink:#141311;
  --font-disp:'Fraunces',Georgia,serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --gut:clamp(16px,4vw,56px);
  --ease:cubic-bezier(.19,1,.22,1);
}

html{scroll-behavior:scroll}
html,body{width:100%;overflow-x:hidden}
body{
  background:var(--bg);color:var(--ink-dim);
  font-family:var(--font-mono);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important;scroll-behavior:auto!important}}
img{max-width:100%;display:block}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:1px solid var(--accent);outline-offset:2px}

/* sprocket strip — signature motif, a single restrained flourish */
.sprockets{
  display:flex;gap:14px;padding:14px var(--gut);
  overflow:hidden;
}
.sprockets span{
  width:7px;height:7px;border-radius:1px;
  background:var(--line2);flex-shrink:0;
}

header{padding:8px var(--gut) 40px;max-width:1400px;margin:0 auto}
.eyeline{
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin-bottom:16px;
}
h1{
  font-family:var(--font-disp);font-style:italic;font-weight:500;
  font-size:clamp(34px,7vw,64px);color:var(--ink);letter-spacing:-.01em;
  line-height:1.05;
}
.subtitle{
  font-size:12.5px;color:var(--muted);margin-top:12px;max-width:420px;line-height:1.6;
}

main{max-width:1400px;margin:0 auto;padding:0 var(--gut) 70px}

/* contact sheet grid */
.sheet{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:3px;background:var(--line);
}
.frame{
  position:relative;aspect-ratio:1;overflow:hidden;cursor:pointer;
  background:var(--bg2);-webkit-tap-highlight-color:transparent;
}
.frame img{
  width:100%;height:100%;object-fit:cover;
  filter:grayscale(15%) contrast(1.04) brightness(.94) saturate(.92);
  opacity:0;transition:transform .5s var(--ease),filter .35s,opacity .4s;
  transform:scale(1.01);
}
.frame img.loaded{opacity:1}
.frame:hover img{transform:scale(1.045);filter:grayscale(0%) contrast(1.04) brightness(1) saturate(1.05)}
.frame-no{
  position:absolute;left:7px;bottom:6px;
  font-size:9.5px;color:rgba(244,241,234,.55);letter-spacing:.04em;
  transition:color .2s;pointer-events:none;
}
.frame:hover .frame-no{color:var(--accent)}
.frame::after{
  content:'';position:absolute;top:6px;right:7px;width:4px;height:4px;
  background:var(--accent);opacity:0;transition:opacity .2s;
}
.frame:hover::after{opacity:1}

.empty{
  padding:60px 0;text-align:center;color:var(--muted);font-size:13px;
  letter-spacing:.03em;
}

footer{
  padding:26px var(--gut) 40px;font-size:10.5px;color:var(--line2);
  letter-spacing:.04em;border-top:1px solid var(--line);max-width:1400px;margin:0 auto;
}

/* ── Lightbox ── */
.lb-backdrop{
  position:fixed;inset:0;background:rgba(10,9,8,.86);backdrop-filter:blur(2px);
  z-index:900;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s var(--ease);
}
.lb-backdrop.open{opacity:1;pointer-events:auto}
.lb{
  width:100%;height:100%;display:flex;flex-direction:column;
}
@media(min-width:800px){
  .lb{max-width:1180px;max-height:88vh;margin:auto;flex-direction:row;
    border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.5);}
}
.lb-img{
  flex:1 1 60%;min-height:0;background:#0c0b0a;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  position:relative;
}
.lb-img img{
  width:100%;height:100%;object-fit:contain;
  transform:translateY(6px);opacity:0;transition:opacity .3s var(--ease),transform .3s var(--ease);
}
.lb-img img.shown{opacity:1;transform:none}
.lb-card{
  flex:0 0 auto;width:100%;background:var(--paper);color:#292520;
  padding:26px 26px 28px;overflow-y:auto;
}
@media(min-width:800px){.lb-card{flex:0 0 340px;padding:38px 32px}}
.lb-date{font-family:var(--font-mono);font-size:10.5px;color:#a8601f;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.lb-title{font-family:var(--font-disp);font-style:italic;font-weight:600;font-size:24px;line-height:1.25;margin-bottom:14px}
.lb-story{font-family:var(--font-disp);font-size:14.5px;line-height:1.75;color:#4a453b;white-space:pre-line}
.lb-story:empty::before{content:'No story written for this one yet.';color:#a39d8e;font-style:italic}
.lb-index{font-family:var(--font-mono);font-size:10px;color:#a39d8e;margin-top:22px;letter-spacing:.05em}

.lb-close,.lb-prev,.lb-next{
  position:absolute;background:rgba(20,19,17,.55);border:1px solid rgba(244,241,234,.18);
  color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;
  border-radius:50%;transition:background .2s,border-color .2s;
}
.lb-close:hover,.lb-prev:hover,.lb-next:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lb-close{top:14px;right:14px;width:36px;height:36px;font-size:17px;z-index:3}
.lb-prev,.lb-next{top:50%;transform:translateY(-50%);width:40px;height:40px;font-size:16px;z-index:2}
.lb-prev{left:12px}
.lb-next{right:12px}
@media(max-width:520px){.lb-prev,.lb-next{width:34px;height:34px}}

@media(max-width:600px){
  .sheet{grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}
  .lb-card{padding:22px 20px 26px}
  .lb-title{font-size:20px}
}
</style>
</head>
<body>

<div class="sprockets" id="sprockets"></div>

<header>
  <div class="eyeline" id="eyeline">roll · unnumbered</div>
  <h1>snapshots &amp; stories</h1>
  <p class="subtitle">A running contact sheet of photos worth keeping, and the small stories that came with them.</p>
</header>

<main>
  <div class="sheet" id="sheet"></div>
  <div class="empty" id="empty" style="display:none">No frames developed yet.</div>
</main>

<footer>kartik chikkanagoudar — photobook</footer>

<div class="lb-backdrop" id="lbBackdrop">
  <div class="lb" onclick="event.stopPropagation()">
    <button class="lb-close" onclick="closeLB()" aria-label="Close">×</button>
    <button class="lb-prev" onclick="stepLB(-1)" aria-label="Previous">‹</button>
    <button class="lb-next" onclick="stepLB(1)" aria-label="Next">›</button>
    <div class="lb-img"><img id="lbImg" src="" alt=""></div>
    <div class="lb-card">
      <div class="lb-date" id="lbDate"></div>
      <div class="lb-title" id="lbTitle"></div>
      <div class="lb-story" id="lbStory"></div>
      <div class="lb-index" id="lbIndex"></div>
    </div>
  </div>
</div>

<script src="posts.js"></script>
<script>
const sheet = document.getElementById('sheet');
const emptyEl = document.getElementById('empty');
const eyeline = document.getElementById('eyeline');

const data = (typeof POSTS !== 'undefined') ? POSTS : [];
eyeline.textContent = `roll · ${data.length} frame${data.length === 1 ? '' : 's'} developed`;

// sprocket holes, count adapts to viewport width roughly
const sprocketWrap = document.getElementById('sprockets');
const sprocketCount = Math.max(18, Math.round(window.innerWidth / 26));
for (let i = 0; i < sprocketCount; i++) {
  const s = document.createElement('span');
  sprocketWrap.appendChild(s);
}

if (!data.length) {
  emptyEl.style.display = 'block';
} else {
  data.forEach((p, i) => {
    const num = String(data.length - i).padStart(2, '0');
    const cell = document.createElement('div');
    cell.className = 'frame';
    cell.innerHTML = `
      <img src="${p.img}" alt="${p.title || ''}" loading="lazy" onload="this.classList.add('loaded')">
      <div class="frame-no">N°${num}</div>
    `;
    cell.addEventListener('click', () => openLB(i));
    sheet.appendChild(cell);
  });
}

/* ── Lightbox ── */
let lbIndex = 0;
const lbBackdrop = document.getElementById('lbBackdrop');
const lbImg = document.getElementById('lbImg');
const lbDate = document.getElementById('lbDate');
const lbTitle = document.getElementById('lbTitle');
const lbStory = document.getElementById('lbStory');
const lbIndexEl = document.getElementById('lbIndex');

function renderLB() {
  const p = data[lbIndex];
  lbImg.classList.remove('shown');
  const im = new Image();
  im.onload = () => { lbImg.src = p.img; lbImg.classList.add('shown'); };
  im.src = p.img;
  lbDate.textContent = p.date || '';
  lbTitle.textContent = p.title || '';
  lbStory.textContent = p.story || '';
  lbIndexEl.textContent = `${lbIndex + 1} / ${data.length}`;
}
function openLB(i) {
  if (!data.length) return;
  lbIndex = i;
  renderLB();
  lbBackdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLB() {
  lbBackdrop.classList.remove('open');
  document.body.style.overflow = '';
}
function stepLB(dir) {
  lbIndex = (lbIndex + dir + data.length) % data.length;
  renderLB();
}
lbBackdrop.addEventListener('click', closeLB);
document.addEventListener('keydown', e => {
  if (!lbBackdrop.classList.contains('open')) return;
  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowRight') stepLB(1);
  if (e.key === 'ArrowLeft') stepLB(-1);
});
</script>
</body>
</html>
